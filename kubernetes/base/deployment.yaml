apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: tfe-devops
  labels:
    app: api-service
    version: "1.0.0"
    project: tfe-devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: api-service
        version: "1.0.0"
        project: tfe-devops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/health"
        backup.velero.io/backup-volumes: data
    spec:
      # Distribuir pods en diferentes nodos para alta disponibilidad
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - api-service
                topologyKey: kubernetes.io/hostname

      securityContext:
        fsGroup: 999
      containers:
        - name: api-service
          # La imagen se actualiza automaticamente por el pipeline CI/CD
          image: DOCKER_USERNAME/tfe-api-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          # Variables de entorno desde ConfigMap
          envFrom:
            - configMapRef:
                name: api-service-config

          # Variables de entorno del pod (informacion del nodo y pod)
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          # Liveness probe: reiniciar si el servicio no responde
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe: enviar trafico solo si esta listo
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Startup probe: dar tiempo extra al inicio
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5

          # Limites de recursos para evitar consumo excesivo
          resources:
            requests:
              memory: "160Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /data

      # Tiempo maximo para apagado graceful
      terminationGracePeriodSeconds: 30

      # No montar el token de SA automaticamente (seguridad)
      automountServiceAccountToken: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: api-service-data
