name: CI/CD Pipeline - TFE DevOps

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: tfe-devops-cluster
  GKE_REGION: us-central1
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/tfe-api-service
  NAMESPACE: tfe-devops

jobs:
  # ============================================================
  # JOB 1: Tests y calidad de codigo
  # ============================================================
  test:
    name: Tests y Calidad
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: microservices/api-service/requirements.txt

      - name: Instalar dependencias
        working-directory: microservices/api-service
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar tests unitarios
        working-directory: microservices/api-service
        run: |
          pytest test_main.py -v --tb=short

      - name: Verificar sintaxis Python (flake8)
        working-directory: microservices/api-service
        run: |
          pip install flake8
          flake8 main.py --max-line-length=120 --ignore=E501,E221,E302,E303,E305

  # ============================================================
  # JOB 2: Build y push de imagen Docker
  # ============================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    # Solo en push a main o develop (no en PRs)
    if: github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Extraer metadata para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y Push de imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: microservices/api-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 3: Despliegue en GKE
  # ============================================================
  deploy:
    name: Deploy en Kubernetes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: build
    # Solo en push a main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Obtener credenciales del cluster GKE
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}

      - name: Crear namespace si no existe
        run: |
          kubectl apply -f kubernetes/base/namespace.yaml

      - name: Aplicar ConfigMap
        run: |
          kubectl apply -f kubernetes/base/configmap.yaml

      - name: Actualizar imagen en el Deployment
        run: |
          IMAGE_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          sed -i "s|DOCKER_USERNAME/tfe-api-service:latest|${{ env.DOCKER_IMAGE }}:${IMAGE_TAG}|g" \
            kubernetes/base/deployment.yaml

      - name: Desplegar en Kubernetes
        run: |
          kubectl apply -f kubernetes/base/deployment.yaml
          kubectl apply -f kubernetes/base/service.yaml
          kubectl apply -f kubernetes/base/hpa.yaml
          kubectl apply -f kubernetes/base/ingress.yaml

      - name: Esperar a que el despliegue termine
        run: |
          kubectl rollout status deployment/api-service \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s

      - name: Verificar pods en ejecucion
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get services -n ${{ env.NAMESPACE }}

      - name: Notificar resultado del despliegue
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Despliegue exitoso en GKE - Commit: ${{ github.sha }}"
          else
            echo "❌ Despliegue fallido - Commit: ${{ github.sha }}"
          fi

  # ============================================================
  # JOB 4: Backup post-despliegue con Velero
  # ============================================================
  backup:
    name: Backup Post-Despliegue
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Obtener credenciales del cluster GKE
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}

      - name: Instalar Velero CLI
        run: |
          VERSION=v1.13.0
          wget https://github.com/vmware-tanzu/velero/releases/download/${VERSION}/velero-${VERSION}-linux-amd64.tar.gz
          tar -xzf velero-${VERSION}-linux-amd64.tar.gz
          sudo mv velero-${VERSION}-linux-amd64/velero /usr/local/bin/

      - name: Crear backup post-despliegue
        run: |
          BACKUP_NAME="post-deploy-$(echo ${{ github.sha }} | cut -c1-7)-$(date +%Y%m%d%H%M)"
          velero backup create ${BACKUP_NAME} \
            --include-namespaces ${{ env.NAMESPACE }} \
            --wait \
            --ttl 168h

      - name: Verificar estado del backup
        run: |
          velero backup get
